<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f0f10;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 80px; margin: 0; color: #333; }
        h2 { font-size: 30px; margin: 0; color: #fff; }
        p { color: #888; font-family: sans-serif; margin-top: 10px; }
        a {
            margin-top: 30px;
            padding: 15px 30px;
            background: #00f3ff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }
        a:hover { background: white; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Ops! Caminho não encontrado.</h2>
    <p>A página ou recurso que você tentou acessar não existe.</p>
    <a href="/">VOLTAR PARA O INÍCIO</a>
</body>
</html>
